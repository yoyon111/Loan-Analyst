name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: investoffice
          POSTGRES_PASSWORD: investoffice
          POSTGRES_DB: investoffice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U investoffice"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://investoffice:investoffice@localhost:5432/investoffice_test
      - run: npm run build
